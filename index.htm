<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatOut - Private Chat & Friend System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #111b21; color: #e9edef; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        .app-container { width: 100%; max-width: 1100px; height: 92vh; background: #222e35; display: flex; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 25px rgba(0,0,0,0.5); }

        /* SIDEBAR (KONTAK & ID) */
        .sidebar { width: 360px; background-color: #111b21; border-right: 1px solid rgba(134,150,160,0.15); display: flex; flex-direction: column; }
        .my-profile { padding: 15px; background-color: #202c33; border-bottom: 1px solid rgba(134,150,160,0.15); display: flex; justify-content: space-between; align-items: center; }
        .profile-left { display: flex; align-items: center; gap: 12px; }
        
        /* AVATAR PROFIL & EDIT */
        .my-avatar-box { position: relative; width: 45px; height: 45px; cursor: pointer; flex-shrink: 0; }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #00a884; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 16px; overflow: hidden; }
        .avatar-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.2s; color: #fff; font-size: 14px; }
        .my-avatar-box:hover .avatar-overlay { opacity: 1; }

        .profile-info h3 { font-size: 15px; color: #00a884; display: flex; align-items: center; gap: 6px; }
        .profile-info .my-id { font-size: 12px; color: #8696a0; margin-top: 3px; font-weight: bold; display: flex; align-items: center; gap: 6px; }

        /* IKON AKSI PROFIL */
        .icon-btn { cursor: pointer; color: #8696a0; transition: 0.2s; font-size: 12px; }
        .icon-btn:hover { color: #00a884; }
        .icon-btn.danger:hover { color: #ea4335; }

        /* TOMBOL RESET ALL */
        .btn-reset-all { background: #ea4335; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; transition: 0.2s; display: flex; align-items: center; gap: 5px; }
        .btn-reset-all:hover { background: #d32f2f; }

        .add-friend-box { padding: 12px; background-color: #111b21; display: flex; gap: 8px; border-bottom: 1px solid rgba(134,150,160,0.15); }
        .add-friend-box input { flex: 1; background: #2a3942; border: none; padding: 8px 12px; border-radius: 6px; color: #fff; font-size: 13px; outline: none; }
        .add-friend-box button { background: #00a884; border: none; color: white; padding: 0 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }

        .friends-list { flex: 1; overflow-y: auto; }
        .friend-item { padding: 12px 15px; border-bottom: 1px solid rgba(134,150,160,0.08); cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
        .friend-item:hover, .friend-item.active { background-color: #2a3942; }
        .friend-left { display: flex; align-items: center; gap: 12px; }
        .friend-avatar { width: 40px; height: 40px; background: #00a884; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; overflow: hidden; color: white; }
        .friend-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .friend-info h4 { font-size: 14px; color: #e9edef; }
        .friend-info p { font-size: 11px; color: #8696a0; }

        /* ACTION BUTTONS (ACCEPT / REJECT / REMOVE) */
        .btn-group { display: flex; gap: 6px; align-items: center; }
        .btn-accept { background: #00a884; border: none; color: white; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .btn-reject { background: #ea4335; border: none; color: white; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .btn-remove-friend { background: none; border: none; color: #8696a0; padding: 6px; cursor: pointer; font-size: 14px; transition: 0.2s; border-radius: 4px; }
        .btn-remove-friend:hover { color: #ea4335; background: rgba(234, 67, 53, 0.1); }
        .status-badge { font-size: 11px; color: #f39c12; background: rgba(243, 156, 18, 0.15); padding: 3px 8px; border-radius: 10px; }

        /* MAIN CHAT AREA */
        .chat-main { flex: 1; display: flex; flex-direction: column; background-color: #0b141a; position: relative; }
        .chat-header { background-color: #202c33; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(134,150,160,0.15); }
        .chat-header-user { display: flex; align-items: center; gap: 12px; }
        
        /* BRANDING POJOK KANAN ATAS */
        .brand-box { text-align: right; }
        .brand-title { font-size: 16px; font-weight: 700; color: #00a884; letter-spacing: 0.5px; }
        .brand-author { font-size: 10px; color: #8696a0; }

        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 0); background-size: 20px 20px; }

        /* BALON PESAN, STATUS CENTANG, DAN LINK CLICKABLE */
        .message { max-width: 65%; padding: 8px 12px; border-radius: 8px; font-size: 14px; word-wrap: break-word; position: relative; }
        .message.received { align-self: flex-start; background-color: #202c33; color: #e9edef; border-top-left-radius: 0; }
        .message.sent { align-self: flex-end; background-color: #005c4b; color: #e9edef; border-top-right-radius: 0; }
        
        /* PESAN STIKER KHUSUS */
        .message.sticker-msg { background: transparent !important; padding: 0 !important; box-shadow: none !important; }
        .message.sticker-msg .sticker-img { width: 130px; height: 130px; object-fit: contain; display: block; cursor: zoom-in; }
        .message.sticker-msg .msg-meta { background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 10px; margin-top: -20px; position: relative; z-index: 2; }

        /* STYLING LINK DALAM CHAT */
        .chat-link { color: #53bdeb; text-decoration: underline; word-break: break-all; font-weight: 600; }
        .chat-link:hover { color: #82d4f7; }

        /* WAKTU DAN IKON CENTANG */
        .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 4px; float: right; margin-top: 4px; margin-left: 10px; }
        .message .msg-time { font-size: 10px; color: #8696a0; }
        .status-check { font-size: 12px; color: #8696a0; }
        .status-check.read { color: #53bdeb; }

        .message-img { max-width: 100%; max-height: 250px; border-radius: 6px; margin-top: 4px; display: block; cursor: zoom-in; transition: transform 0.2s ease; }
        .message-img:hover { opacity: 0.9; }
        
        /* Tombol Hapus Pesan */
        .msg-delete-btn { position: absolute; top: 4px; right: 6px; font-size: 11px; color: rgba(255,255,255,0.4); cursor: pointer; opacity: 0; transition: 0.2s; display: none; }
        .message.sent:hover .msg-delete-btn { opacity: 1; display: block; }
        .msg-delete-btn:hover { color: #ea4335; }

        .chat-footer { background-color: #202c33; padding: 10px 16px; display: flex; align-items: center; gap: 10px; position: relative; }
        .btn-footer-icon { background: none; border: none; color: #8696a0; font-size: 20px; cursor: pointer; transition: 0.2s; padding: 0 4px; }
        .btn-footer-icon:hover:not(:disabled) { color: #00a884; }
        .btn-footer-icon:disabled { color: #4a555c; cursor: not-allowed; }
        
        .input-box { flex: 1; background-color: #2a3942; border-radius: 8px; padding: 0 12px; }
        .input-box input { width: 100%; padding: 10px; background: transparent; border: none; color: #e9edef; outline: none; font-size: 14px; }
        .send-btn { background-color: #00a884; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
        .send-btn:disabled { background-color: #2a3942; cursor: not-allowed; color: #8696a0; }

        /* STICKER PICKER PANEL */
        .sticker-panel { position: absolute; bottom: 65px; left: 16px; width: 320px; height: 320px; background: #202c33; border: 1px solid rgba(134,150,160,0.2); border-radius: 12px; display: flex; flex-direction: column; z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.4); opacity: 0; pointer-events: none; transform: translateY(10px); transition: 0.2s ease; }
        .sticker-panel.active { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .sticker-header { padding: 10px 12px; border-bottom: 1px solid rgba(134,150,160,0.15); display: flex; justify-content: space-between; align-items: center; }
        .sticker-header h4 { font-size: 13px; color: #e9edef; font-weight: 600; }
        .sticker-actions { display: flex; gap: 8px; align-items: center; }
        .btn-sticker-opt { background: #2a3942; border: none; color: #00a884; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; transition: 0.2s; }
        .btn-sticker-opt:hover { background: #00a884; color: #fff; }
        .btn-sticker-danger { color: #ea4335; }
        .btn-sticker-danger:hover { background: #ea4335; color: #fff; }

        .sticker-grid { flex: 1; padding: 10px; overflow-y: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; align-content: start; }
        .sticker-item { position: relative; aspect-ratio: 1; background: rgba(255,255,255,0.03); border-radius: 8px; padding: 4px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .sticker-item:hover { background: rgba(255,255,255,0.08); border-color: #00a884; }
        .sticker-item img { width: 100%; height: 100%; object-fit: contain; }
        .sticker-del-btn { position: absolute; top: -5px; right: -5px; background: #ea4335; color: white; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; opacity: 0; transition: 0.2s; cursor: pointer; }
        .sticker-item:hover .sticker-del-btn { opacity: 1; }

        /* CUSTOM POPUP MODAL STYLES */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.2s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card { background: #222e35; border-radius: 12px; width: 90%; max-width: 380px; padding: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); transform: translateY(-20px); transition: 0.2s ease; }
        .modal-overlay.active .modal-card { transform: translateY(0); }
        .modal-icon { font-size: 36px; color: #f39c12; margin-bottom: 10px; }
        .modal-title { font-size: 16px; font-weight: bold; color: #e9edef; margin-bottom: 8px; }
        .modal-desc { font-size: 13px; color: #8696a0; margin-bottom: 20px; line-height: 1.4; }
        .modal-actions { display: flex; gap: 10px; justify-content: center; }
        .modal-btn { padding: 8px 16px; border-radius: 6px; border: none; font-size: 13px; font-weight: bold; cursor: pointer; flex: 1; }
        .modal-btn-cancel { background: #2a3942; color: #e9edef; }
        .modal-btn-confirm { background: #ea4335; color: white; }

        /* LIGHTBOX IMAGE ZOOM MODAL STYLES */
        .lightbox-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); display: flex; justify-content: center; align-items: center; z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; overflow: hidden; }
        .lightbox-overlay.active { opacity: 1; pointer-events: auto; }
        .lightbox-content { position: relative; max-width: 90vw; max-height: 85vh; display: flex; justify-content: center; align-items: center; }
        .lightbox-img { max-width: 100%; max-height: 85vh; border-radius: 6px; object-fit: contain; transition: transform 0.1s ease-out; cursor: grab; user-select: none; }
        .lightbox-img:active { cursor: grabbing; }

        /* TOOLBAR KONTROL ZOOM */
        .lightbox-controls { position: absolute; bottom: 25px; display: flex; gap: 12px; background: rgba(32, 44, 51, 0.85); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1); z-index: 2001; }
        .lightbox-btn { background: none; border: none; color: #e9edef; font-size: 18px; cursor: pointer; padding: 6px 10px; border-radius: 50%; transition: 0.2s; }
        .lightbox-btn:hover { color: #00a884; background: rgba(255,255,255,0.1); }
        .lightbox-close { position: absolute; top: 20px; right: 25px; color: #e9edef; font-size: 28px; cursor: pointer; z-index: 2001; transition: 0.2s; }
        .lightbox-close:hover { color: #ea4335; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="my-profile">
            <div class="profile-left">
                <!-- AVATAR PROFIL & INPUT FILE -->
                <div class="my-avatar-box" id="avatarClickArea" title="Klik untuk ganti foto profil">
                    <div class="avatar-img" id="myAvatarDisplay">U</div>
                    <div class="avatar-overlay"><i class="fa-solid fa-camera"></i></div>
                </div>
                <input type="file" id="avatarFileInput" accept="image/*" style="display: none;">

                <div class="profile-info">
                    <h3>
                        <span id="myUsernameDisplay">Profil Saya</span>
                        <i class="fa-solid fa-pen-to-square icon-btn" id="editNameBtn" title="Ganti Nama"></i>
                    </h3>
                    <div class="my-id">
                        <span id="myIdDisplay">ID: Memuat...</span>
                        <i class="fa-solid fa-copy icon-btn" id="copyIdBtn" title="Salin ID"></i>
                        <i class="fa-solid fa-rotate icon-btn danger" id="newIdBtn" title="Buat ID Baru"></i>
                    </div>
                </div>
            </div>

            <!-- TOMBOL RESET ALL DATA TOTAL -->
            <button class="btn-reset-all" id="resetAllBtn" title="Reset Semua Data Akun Dari Nol">
                <i class="fa-solid fa-trash"></i> Reset All
            </button>
        </div>

        <div class="add-friend-box">
            <input type="text" id="friendIdInput" placeholder="Masukkan ID Teman...">
            <button id="addFriendBtn"><i class="fa-solid fa-user-plus"></i></button>
        </div>

        <div class="friends-list" id="friendsList">
            <!-- Daftar Teman Dimuat di Sini secara Realtime -->
        </div>
    </div>

    <!-- MAIN CHAT AREA -->
    <div class="chat-main">
        <div class="chat-header">
            <div class="chat-header-user">
                <div class="friend-avatar" id="activeAvatar"><i class="fa-solid fa-user"></i></div>
                <div>
                    <h3 id="activeChatTitle" style="font-size: 15px;">Pilih Teman untuk Chat</h3>
                    <p id="activeChatSubtitle" style="font-size: 11px; color: #8696a0;">Tambahkan ID teman untuk memulai obrolan</p>
                </div>
            </div>
            <div class="brand-box">
                <div class="brand-title">ChatOut</div>
                <div class="brand-author">By: Ardio</div>
            </div>
        </div>

        <div class="chat-box" id="chatBox">
            <div style="text-align: center; color: #8696a0; font-size: 12px; margin-top: 30px;">
                Silakan pilih teman yang sudah terkonfirmasi!
            </div>
        </div>

        <!-- STICKER PICKER PANEL -->
        <div class="sticker-panel" id="stickerPanel">
            <div class="sticker-header">
                <h4>Koleksi Sticker</h4>
                <div class="sticker-actions">
                    <button class="btn-sticker-opt" id="addStickerBtn" title="Tambah Sticker Baru"><i class="fa-solid fa-plus"></i> Tambah</button>
                    <button class="btn-sticker-opt btn-sticker-danger" id="deleteAllStickersBtn" title="Hapus Semua Sticker"><i class="fa-solid fa-trash"></i> All</button>
                </div>
            </div>
            <div class="sticker-grid" id="stickerGrid">
                <!-- Sticker akan dimuat di sini -->
            </div>
        </div>
        <input type="file" id="stickerFileInput" accept="image/*" style="display: none;">

        <div class="chat-footer">
            <!-- TOMBOL STICKER DAN IMAGE -->
            <button class="btn-footer-icon" id="stickerToggleBtn" title="Kirim Sticker" disabled>
                <i class="fa-solid fa-note-sticky"></i>
            </button>
            <button class="btn-footer-icon" id="chatImageBtn" title="Kirim Gambar (Bisa pilih lebih dari satu)" disabled>
                <i class="fa-solid fa-image"></i>
            </button>
            <input type="file" id="chatFileInput" accept="image/*" multiple style="display: none;">

            <div class="input-box">
                <input type="text" id="messageInput" placeholder="Ketik pesan..." disabled>
            </div>
            <button class="send-btn" id="sendBtn" disabled><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<!-- CUSTOM POPUP MODAL -->
<div class="modal-overlay" id="customModal">
    <div class="modal-card">
        <div class="modal-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <div class="modal-title" id="modalTitle">Konfirmasi</div>
        <div class="modal-desc" id="modalDesc">Deskripsi...</div>
        <div class="modal-actions">
            <button class="modal-btn modal-btn-cancel" id="modalCancelBtn">Batal</button>
            <button class="modal-btn modal-btn-confirm" id="modalConfirmBtn">Ya, Lanjutkan</button>
        </div>
    </div>
</div>

<!-- LIGHTBOX IMAGE ZOOM MODAL -->
<div class="lightbox-overlay" id="imageLightbox">
    <i class="fa-solid fa-xmark lightbox-close" id="lightboxCloseBtn" title="Tutup (ESC)"></i>
    <div class="lightbox-content">
        <img src="" alt="Zoom Image" class="lightbox-img" id="lightboxTargetImg">
    </div>
    <div class="lightbox-controls">
        <button class="lightbox-btn" id="zoomInBtn" title="Perbesar (+)"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
        <button class="lightbox-btn" id="zoomOutBtn" title="Perkecil (-)"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
        <button class="lightbox-btn" id="rotateBtn" title="Putar Gambar"><i class="fa-solid fa-rotate-right"></i></button>
        <button class="lightbox-btn" id="zoomResetBtn" title="Reset Ukuran"><i class="fa-solid fa-arrows-rotate"></i></button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, get, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBuZ91-4IY92nOaqeWPZQ24VHwUdmSzhsA",
        authDomain: "chatout-c97c3.firebaseapp.com",
        projectId: "chatout-c97c3",
        storageBucket: "chatout-c97c3.firebasestorage.app",
        messagingSenderId: "793965681890",
        appId: "1:793965681890:web:8dcc55c9c39ce05e1812bb",
        measurementId: "G-FJW24WXV0R"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- SETUP USER & ID UNIK ---
    let myId = localStorage.getItem('chatout_my_id');
    let myName = localStorage.getItem('chatout_my_name');
    let myPhoto = localStorage.getItem('chatout_my_photo') || '';

    if (!myId) {
        myId = "USER-" + Math.floor(1000 + Math.random() * 9000);
        myName = prompt("Masukkan nama pengguna kamu:", "User " + myId.split('-')[1]) || "User_" + myId;
        localStorage.setItem('chatout_my_id', myId);
        localStorage.setItem('chatout_my_name', myName);
    }

    // Default Stickers
    const defaultStickers = [
        "https://cdn-icons-png.flaticon.com/512/4712/4712035.png",
        "https://cdn-icons-png.flaticon.com/512/4712/4712038.png",
        "https://cdn-icons-png.flaticon.com/512/4712/4712040.png",
        "https://cdn-icons-png.flaticon.com/512/4712/4712051.png"
    ];

    let savedStickers = JSON.parse(localStorage.getItem('chatout_stickers')) || defaultStickers;

    // Pastikan Profil Pengguna Tersimpan Aman di Database
    update(ref(db, 'users/' + myId), {
        id: myId,
        name: myName,
        photo: myPhoto
    });

    document.getElementById('myUsernameDisplay').innerText = myName;
    document.getElementById('myIdDisplay').innerText = "ID: " + myId;

    function updateMyAvatarUI() {
        const avatarEl = document.getElementById('myAvatarDisplay');
        if (myPhoto) {
            avatarEl.innerHTML = `<img src="${myPhoto}" style="width:100%; height:100%; object-fit:cover;">`;
        } else {
            avatarEl.innerText = myName ? myName.charAt(0).toUpperCase() : 'U';
        }
    }
    updateMyAvatarUI();

    let activeFriendId = null;
    let currentChatRoomId = null;

    const friendsListEl = document.getElementById('friendsList');
    const friendIdInput = document.getElementById('friendIdInput');
    const addFriendBtn = document.getElementById('addFriendBtn');
    const resetAllBtn = document.getElementById('resetAllBtn');
    const editNameBtn = document.getElementById('editNameBtn');
    const copyIdBtn = document.getElementById('copyIdBtn');
    const newIdBtn = document.getElementById('newIdBtn');
    const avatarClickArea = document.getElementById('avatarClickArea');
    const avatarFileInput = document.getElementById('avatarFileInput');
    const chatBox = document.getElementById('chatBox');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatImageBtn = document.getElementById('chatImageBtn');
    const chatFileInput = document.getElementById('chatFileInput');

    // Sticker Elements
    const stickerToggleBtn = document.getElementById('stickerToggleBtn');
    const stickerPanel = document.getElementById('stickerPanel');
    const stickerGrid = document.getElementById('stickerGrid');
    const addStickerBtn = document.getElementById('addStickerBtn');
    const deleteAllStickersBtn = document.getElementById('deleteAllStickersBtn');
    const stickerFileInput = document.getElementById('stickerFileInput');

    // Pop-up Modal Elements
    const customModal = document.getElementById('customModal');
    const modalCancelBtn = document.getElementById('modalCancelBtn');
    const modalConfirmBtn = document.getElementById('modalConfirmBtn');

    // Lightbox Zoom Elements
    const imageLightbox = document.getElementById('imageLightbox');
    const lightboxTargetImg = document.getElementById('lightboxTargetImg');
    const lightboxCloseBtn = document.getElementById('lightboxCloseBtn');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const rotateBtn = document.getElementById('rotateBtn');
    const zoomResetBtn = document.getElementById('zoomResetBtn');

    let currentScale = 1;
    let currentRotation = 0;
    let activeConfirmHandler = null;

    // --- POPUP MODAL ---
    function showModal(title, desc, confirmText, onConfirm) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalDesc').innerText = desc;
        modalConfirmBtn.innerText = confirmText;

        if (activeConfirmHandler) {
            modalConfirmBtn.removeEventListener('click', activeConfirmHandler);
        }

        activeConfirmHandler = () => {
            onConfirm();
            closeModal();
        };

        modalConfirmBtn.addEventListener('click', activeConfirmHandler);
        customModal.classList.add('active');
    }

    function closeModal() {
        customModal.classList.remove('active');
        if (activeConfirmHandler) {
            modalConfirmBtn.removeEventListener('click', activeConfirmHandler);
            activeConfirmHandler = null;
        }
    }

    modalCancelBtn.addEventListener('click', closeModal);

    // --- MANAJEMEN STICKER ---
    function saveStickersToStorage() {
        localStorage.setItem('chatout_stickers', JSON.stringify(savedStickers));
        renderStickerPanel();
    }

    function renderStickerPanel() {
        stickerGrid.innerHTML = '';
        if (savedStickers.length === 0) {
            stickerGrid.innerHTML = `<div style="grid-column: span 4; text-align: center; color: #8696a0; font-size: 11px; margin-top: 20px;">Belum ada sticker</div>`;
            return;
        }

        savedStickers.forEach((stkUrl, index) => {
            const item = document.createElement('div');
            item.className = 'sticker-item';
            item.innerHTML = `
                <img src="${stkUrl}" alt="Sticker">
                <div class="sticker-del-btn" title="Hapus Sticker Ini"><i class="fa-solid fa-xmark"></i></div>
            `;

            item.querySelector('img').addEventListener('click', () => {
                sendStickerMessage(stkUrl);
                stickerPanel.classList.remove('active');
            });

            item.querySelector('.sticker-del-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                savedStickers.splice(index, 1);
                saveStickersToStorage();
            });

            stickerGrid.appendChild(item);
        });
    }

    renderStickerPanel();

    stickerToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        stickerPanel.classList.toggle('active');
    });

    document.addEventListener('click', (e) => {
        if (!stickerPanel.contains(e.target) && e.target !== stickerToggleBtn) {
            stickerPanel.classList.remove('active');
        }
    });

    addStickerBtn.addEventListener('click', () => {
        const choice = prompt("Pilih metode tambah sticker:\n1. Upload Gambar dari Perangkat\n2. Masukkan URL Gambar Sticker\n(Ketik 1 atau 2)", "1");
        if (choice === "1") {
            stickerFileInput.click();
        } else if (choice === "2") {
            const url = prompt("Masukkan Link/URL Sticker:");
            if (url && url.trim() !== '') {
                savedStickers.push(url.trim());
                saveStickersToStorage();
            }
        }
    });

    stickerFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (evt) => {
                savedStickers.push(evt.target.result);
                saveStickersToStorage();
            };
            reader.readAsDataURL(file);
        }
    });

    deleteAllStickersBtn.addEventListener('click', () => {
        if (savedStickers.length === 0) return;
        showModal(
            "Hapus Semua Sticker",
            "Apakah Anda yakin ingin menghapus seluruh koleksi sticker yang tersimpan?",
            "Ya, Hapus Semua",
            () => {
                savedStickers = [];
                saveStickersToStorage();
            }
        );
    });

    // --- LIGHTBOX ZOOM ---
    window.openZoomModal = function(imgSrc) {
        lightboxTargetImg.src = imgSrc;
        currentScale = 1;
        currentRotation = 0;
        updateTransform();
        imageLightbox.classList.add('active');
    };

    function closeZoomModal() {
        imageLightbox.classList.remove('active');
    }

    function updateTransform() {
        lightboxTargetImg.style.transform = `scale(${currentScale}) rotate(${currentRotation}deg)`;
    }

    zoomInBtn.addEventListener('click', () => {
        currentScale = Math.min(currentScale + 0.3, 4);
        updateTransform();
    });

    zoomOutBtn.addEventListener('click', () => {
        currentScale = Math.max(currentScale - 0.3, 0.5);
        updateTransform();
    });

    rotateBtn.addEventListener('click', () => {
        currentRotation = (currentRotation + 90) % 360;
        updateTransform();
    });

    zoomResetBtn.addEventListener('click', () => {
        currentScale = 1;
        currentRotation = 0;
        updateTransform();
    });

    lightboxCloseBtn.addEventListener('click', closeZoomModal);

    imageLightbox.addEventListener('wheel', (e) => {
        if (!imageLightbox.classList.contains('active')) return;
        e.preventDefault();
        if (e.deltaY < 0) {
            currentScale = Math.min(currentScale + 0.2, 4);
        } else {
            currentScale = Math.max(currentScale - 0.2, 0.5);
        }
        updateTransform();
    });

    imageLightbox.addEventListener('click', (e) => {
        if (e.target === imageLightbox || e.target.classList.contains('lightbox-content')) {
            closeZoomModal();
        }
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && imageLightbox.classList.contains('active')) {
            closeZoomModal();
        }
    });

    // --- PROFIL USER ---
    avatarClickArea.addEventListener('click', () => {
        const choice = prompt("Pilih opsi foto profil:\n1. Upload Foto dari Perangkat\n2. Masukkan Link/URL Gambar\n3. Hapus Foto Profil\n(Ketik angka 1, 2, atau 3)", "1");
        
        if (choice === "1") {
            avatarFileInput.click();
        } else if (choice === "2") {
            const photoUrl = prompt("Masukkan Link/URL foto profil (misal: https://...):");
            if (photoUrl && photoUrl.trim() !== "") {
                saveNewPhoto(photoUrl.trim());
            }
        } else if (choice === "3") {
            saveNewPhoto('');
        }
    });

    avatarFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                saveNewPhoto(event.target.result);
            };
            reader.readAsDataURL(file);
        }
    });

    async function saveNewPhoto(photoData) {
        myPhoto = photoData;
        localStorage.setItem('chatout_my_photo', myPhoto);
        updateMyAvatarUI();

        await update(ref(db, 'users/' + myId), { photo: myPhoto });
        alert("Foto profil berhasil diperbarui!");
    }

    newIdBtn.addEventListener('click', () => {
        showModal(
            "Konfirmasi Buat ID Baru",
            "ID kamu yang lama akan dihapus. Semua koneksi pertemanan akan di-reset untuk ID baru ini. Yakin ingin melanjutkan?",
            "Ya, Buat ID Baru",
            async () => {
                try {
                    await remove(ref(db, 'users/' + myId));
                    await remove(ref(db, 'friends/' + myId));
                } catch(e) {}

                const newIdGenerated = "USER-" + Math.floor(1000 + Math.random() * 9000);
                localStorage.setItem('chatout_my_id', newIdGenerated);
                location.reload();
            }
        );
    });

    editNameBtn.addEventListener('click', async () => {
        const newName = prompt("Masukkan nama pengguna baru:", myName);
        if (newName && newName.trim() !== "" && newName !== myName) {
            myName = newName.trim();
            localStorage.setItem('chatout_my_name', myName);
            document.getElementById('myUsernameDisplay').innerText = myName;
            updateMyAvatarUI();

            await update(ref(db, 'users/' + myId), { name: myName });
            alert("Nama pengguna berhasil diubah!");
        }
    });

    copyIdBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(myId).then(() => {
            alert(`ID "${myId}" berhasil disalin ke clipboard!`);
        }).catch(() => {
            alert("Gagal menyalin ID.");
        });
    });

    // --- TAMBAH TEMAN ---
    addFriendBtn.addEventListener('click', async () => {
        const targetId = friendIdInput.value.trim();
        if (!targetId) return alert("Masukkan ID teman terlebih dahulu!");
        if (targetId === myId) return alert("Tidak bisa menambahkan ID sendiri!");

        try {
            const snapshot = await get(ref(db, 'users/' + targetId));
            if (snapshot.exists()) {
                const friendData = snapshot.val();

                await set(ref(db, `friends/${myId}/${targetId}`), {
                    id: friendData.id,
                    status: 'pending_out'
                });

                await set(ref(db, `friends/${targetId}/${myId}`), {
                    id: myId,
                    status: 'pending_in'
                });

                alert(`Permintaan pertemanan dikirim ke ${friendData.name}! Menunggu diterima.`);
                friendIdInput.value = '';
            } else {
                alert("ID Teman tidak ditemukan! Pastikan ID sudah benar.");
            }
        } catch(e) {
            alert("Terjadi kesalahan saat menambahkan teman.");
        }
    });

    window.acceptFriend = async (friendId) => {
        try {
            await update(ref(db, `friends/${myId}/${friendId}`), { status: 'accepted' });
            await update(ref(db, `friends/${friendId}/${myId}`), { status: 'accepted' });
        } catch(e) {}
    };

    window.rejectFriend = async (friendId) => {
        try {
            await remove(ref(db, `friends/${myId}/${friendId}`));
            await remove(ref(db, `friends/${friendId}/${myId}`));
        } catch(e) {}
    };

    // --- FIX BUG: HAPUS PERTEMANAN TANPA MERUSAK NAMA & APLIKASI ---
    window.removeFriend = (friendId, friendName) => {
        showModal(
            "Hapus Pertemanan",
            `Apakah kamu yakin ingin menghapus ${friendName} (${friendId}) dari daftar teman?`,
            "Ya, Hapus",
            async () => {
                try {
                    // Hapus koneksi dari node friends saja (TIDAK menyentuh node users)
                    await remove(ref(db, `friends/${myId}/${friendId}`));
                    
                    const checkTargetFriendRef = await get(ref(db, `friends/${friendId}/${myId}`));
                    if (checkTargetFriendRef.exists()) {
                        await remove(ref(db, `friends/${friendId}/${myId}`));
                    }
                } catch(error) {
                    console.error("Error menghapus teman:", error);
                }

                // Reset Tampilan Chat Jika Teman yang Dihapus Sedang Terbuka
                if (activeFriendId === friendId) {
                    activeFriendId = null;
                    currentChatRoomId = null;
                    document.getElementById('activeChatTitle').innerText = "Pilih Teman untuk Chat";
                    document.getElementById('activeChatSubtitle').innerText = "Tambahkan ID teman untuk memulai obrolan";
                    document.getElementById('activeAvatar').innerHTML = `<i class="fa-solid fa-user"></i>`;
                    
                    messageInput.disabled = true;
                    sendBtn.disabled = true;
                    chatImageBtn.disabled = true;
                    stickerToggleBtn.disabled = true;
                    chatBox.innerHTML = '<div style="text-align: center; color: #8696a0; font-size: 12px; margin-top: 30px;">Silakan pilih teman yang sudah terkonfirmasi!</div>';
                }
            }
        );
    };

    // --- RESET TOTAL ALL DATA ---
    resetAllBtn.addEventListener('click', () => {
        showModal(
            "RESET TOTAL SEMUA DATA AKUN",
            "PERINGATAN: Nama, Foto Profil, ID, Semua Kontak Teman, dan Riwayat Chat kamu akan DIHAPUS TOTAL DARI NOL. Apakah kamu yakin?",
            "Ya, Hapus Semua & Reset",
            async () => {
                try {
                    const snapshot = await get(ref(db, `friends/${myId}`));
                    if (snapshot.exists()) {
                        const friendsData = snapshot.val();
                        for (let friendId in friendsData) {
                            await remove(ref(db, `friends/${friendId}/${myId}`));
                        }
                    }
                    await remove(ref(db, `friends/${myId}`));
                    await remove(ref(db, `users/${myId}`));
                } catch(e) {}

                localStorage.removeItem('chatout_my_id');
                localStorage.removeItem('chatout_my_name');
                localStorage.removeItem('chatout_my_photo');

                location.reload();
            }
        );
    });

    // --- TAMPILKAN DAFTAR TEMAN REALTIME ---
    onValue(ref(db, `friends/${myId}`), (snapshot) => {
        friendsListEl.innerHTML = '';
        const data = snapshot.val();
        
        if (data && Object.keys(data).length > 0) {
            Object.values(data).forEach(friendRef => {
                onValue(ref(db, `users/${friendRef.id}`), (userSnap) => {
                    const userData = userSnap.val() || { name: 'User ' + friendRef.id, photo: '' };
                    
                    let item = document.getElementById(`friend-item-${friendRef.id}`);
                    if (!item) {
                        item = document.createElement('div');
                        item.id = `friend-item-${friendRef.id}`;
                        friendsListEl.appendChild(item);
                    }

                    item.className = `friend-item ${activeFriendId === friendRef.id ? 'active' : ''}`;

                    let actionHTML = '';
                    if (friendRef.status === 'pending_out') {
                        actionHTML = `<span class="status-badge"><i class="fa-solid fa-clock"></i> Pending</span>`;
                    } else if (friendRef.status === 'pending_in') {
                        actionHTML = `
                            <div class="btn-group">
                                <button class="btn-accept" onclick="acceptFriend('${friendRef.id}')"><i class="fa-solid fa-check"></i> Accept</button>
                                <button class="btn-reject" onclick="rejectFriend('${friendRef.id}')"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        `;
                    } else if (friendRef.status === 'accepted') {
                        actionHTML = `
                            <button class="btn-remove-friend" onclick="removeFriend('${friendRef.id}', '${userData.name.replace(/'/g, "\\'")}')" title="Hapus Pertemanan">
                                <i class="fa-solid fa-user-minus"></i>
                            </button>
                        `;
                    }

                    let avatarContent = userData.photo 
                        ? `<img src="${userData.photo}">` 
                        : (userData.name ? userData.name.charAt(0).toUpperCase() : 'U');

                    item.innerHTML = `
                        <div class="friend-left">
                            <div class="friend-avatar">${avatarContent}</div>
                            <div class="friend-info">
                                <h4>${userData.name}</h4>
                                <p>${friendRef.id}</p>
                            </div>
                        </div>
                        <div>${actionHTML}</div>
                    `;

                    if (activeFriendId === friendRef.id) {
                        document.getElementById('activeChatTitle').innerText = userData.name;
                        const headerAvatar = document.getElementById('activeAvatar');
                        if (userData.photo) {
                            headerAvatar.innerHTML = `<img src="${userData.photo}" style="width:100%; height:100%; object-fit:cover;">`;
                        } else {
                            headerAvatar.innerText = userData.name ? userData.name.charAt(0).toUpperCase() : 'U';
                        }
                    }

                    item.onclick = (e) => {
                        if (e.target.closest('button')) return;
                        if (friendRef.status === 'accepted') {
                            openChatRoom(friendRef.id, userData);
                        } else {
                            alert("Pertemanan belum terkonfirmasi!");
                        }
                    };
                });
            });
        } else {
            friendsListEl.innerHTML = `<div style="text-align:center; padding:20px; color:#8696a0; font-size:12px;">Belum ada teman. Tambahkan ID teman!</div>`;
        }
    });

    // --- CHAT SYSTEM REALTIME ---
    function openChatRoom(friendId, friendData) {
        activeFriendId = friendId;
        currentChatRoomId = myId < friendId ? `${myId}_${friendId}` : `${friendId}_${myId}`;

        document.querySelectorAll('.friend-item').forEach(el => el.classList.remove('active'));
        const activeItem = document.getElementById(`friend-item-${friendId}`);
        if (activeItem) activeItem.classList.add('active');

        document.getElementById('activeChatTitle').innerText = friendData.name;
        document.getElementById('activeChatSubtitle').innerText = "Online - Private Chat";
        const headerAvatar = document.getElementById('activeAvatar');
        if (friendData.photo) {
            headerAvatar.innerHTML = `<img src="${friendData.photo}" style="width:100%; height:100%; object-fit:cover;">`;
        } else {
            headerAvatar.innerText = friendData.name ? friendData.name.charAt(0).toUpperCase() : 'U';
        }

        messageInput.disabled = false;
        sendBtn.disabled = false;
        chatImageBtn.disabled = false;
        stickerToggleBtn.disabled = false;
        messageInput.focus();

        loadMessages();
    }

    function loadMessages() {
        const chatRef = ref(db, `chats/${currentChatRoomId}`);
        onValue(chatRef, (snapshot) => {
            chatBox.innerHTML = '';
            const messages = snapshot.val();

            if (messages) {
                Object.entries(messages).forEach(([msgId, msg]) => {
                    const isSent = msg.sender === myId;

                    if (!isSent && !msg.read) {
                        update(ref(db, `chats/${currentChatRoomId}/${msgId}`), { read: true });
                    }

                    const msgDiv = document.createElement('div');
                    
                    if (msg.type === 'sticker') {
                        msgDiv.className = `message ${isSent ? 'sent' : 'received'} sticker-msg`;
                        msgDiv.innerHTML = `
                            ${isSent ? `<i class="fa-solid fa-trash msg-delete-btn" onclick="deleteMessage('${msgId}')" title="Hapus Pesan"></i>` : ''}
                            <img src="${msg.content}" class="sticker-img" onclick="openZoomModal('${msg.content}')" alt="Sticker">
                            <div class="msg-meta">
                                <span class="msg-time">${msg.time}</span>
                                ${isSent ? `<i class="fa-solid fa-check-double status-check ${msg.read ? 'read' : ''}"></i>` : ''}
                            </div>
                        `;
                    } else {
                        msgDiv.className = `message ${isSent ? 'sent' : 'received'}`;
                        let contentHTML = '';
                        if (msg.type === 'image') {
                            contentHTML = `<img src="${msg.content}" class="message-img" onclick="openZoomModal('${msg.content}')" alt="Pesan Gambar">`;
                        } else {
                            contentHTML = formatMessageText(msg.content);
                        }

                        msgDiv.innerHTML = `
                            ${isSent ? `<i class="fa-solid fa-trash msg-delete-btn" onclick="deleteMessage('${msgId}')" title="Hapus Pesan"></i>` : ''}
                            <div>${contentHTML}</div>
                            <div class="msg-meta">
                                <span class="msg-time">${msg.time}</span>
                                ${isSent ? `<i class="fa-solid fa-check-double status-check ${msg.read ? 'read' : ''}"></i>` : ''}
                            </div>
                        `;
                    }

                    chatBox.appendChild(msgDiv);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            } else {
                chatBox.innerHTML = '<div style="text-align: center; color: #8696a0; font-size: 12px; margin-top: 30px;">Belum ada pesan. Mulai obrolan sekarang!</div>';
            }
        });
    }

    function formatMessageText(text) {
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        return text.replace(urlRegex, (url) => {
            return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="chat-link">${url}</a>`;
        });
    }

    window.deleteMessage = (msgId) => {
        showModal(
            "Hapus Pesan",
            "Apakah kamu yakin ingin menghapus pesan ini?",
            "Ya, Hapus",
            async () => {
                try {
                    await remove(ref(db, `chats/${currentChatRoomId}/${msgId}`));
                } catch(e) {}
            }
        );
    };

    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text || !currentChatRoomId) return;

        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        push(ref(db, `chats/${currentChatRoomId}`), {
            sender: myId,
            content: text,
            type: 'text',
            time: time,
            read: false
        });

        messageInput.value = '';
    }

    function sendStickerMessage(stickerUrl) {
        if (!currentChatRoomId) return;

        if (!savedStickers.includes(stickerUrl)) {
            savedStickers.push(stickerUrl);
            saveStickersToStorage();
        }

        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        push(ref(db, `chats/${currentChatRoomId}`), {
            sender: myId,
            content: stickerUrl,
            type: 'sticker',
            time: time,
            read: false
        });
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    chatImageBtn.addEventListener('click', () => {
        chatFileInput.click();
    });

    chatFileInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        if (files.length > 0 && currentChatRoomId) {
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    push(ref(db, `chats/${currentChatRoomId}`), {
                        sender: myId,
                        content: event.target.result,
                        type: 'image',
                        time: time,
                        read: false
                    });
                };
                reader.readAsDataURL(file);
            });
            chatFileInput.value = '';
        }
    });
</script>
</body>
</html>
